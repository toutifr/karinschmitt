<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karin Schmitt — Céramiques et porcelaines peintes</title>
<meta name="description" content="Karin Schmitt — céramiques et porcelaines peintes à la main en Alsace. Pièces uniques, plaisirs personnalisés, stages à l'atelier.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2;
    --ink:#2b2724;
    --muted:#7d746b;
    --accent:#9c4a3c;
    --line:#e6ded3;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Jost',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.7;font-size:17px}
  .wrap{max-width:1060px;margin:0 auto;padding:0 24px}

  header{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(250,247,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{font-family:var(--serif);font-size:1.35rem;font-weight:600;letter-spacing:.04em;text-decoration:none;color:var(--ink)}
  .brand span{color:var(--accent)}
  nav a{color:var(--muted);text-decoration:none;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;margin-left:26px;transition:color .2s}
  nav a:hover{color:var(--accent)}
  @media(max-width:720px){nav a{margin-left:14px;font-size:.72rem;letter-spacing:.08em}}

  .hero{padding:150px 0 60px;text-align:center}
  .hero h1{font-family:var(--serif);font-size:clamp(2.4rem,6vw,4rem);font-weight:500;letter-spacing:.02em}
  .hero .sub{color:var(--accent);font-family:var(--serif);font-style:italic;font-size:clamp(1.2rem,3vw,1.6rem);margin-top:6px}
  .band{margin:48px auto 0;max-width:900px;padding:0 24px}
  .band img{width:100%;border-radius:4px;display:block}

  .poem{max-width:640px;margin:70px auto;text-align:center;font-family:var(--serif);font-style:italic;font-size:1.35rem;line-height:2;color:#514a43}
  .poem strong{display:block;margin-top:1.2em;color:var(--accent);font-style:normal;font-weight:600;letter-spacing:.02em}

  section{padding:80px 0}
  .sec-title{text-align:center;margin-bottom:14px}
  .sec-title h2{font-family:var(--serif);font-size:2.2rem;font-weight:500}
  .sec-title p{color:var(--muted);max-width:560px;margin:10px auto 0}
  .rule{width:56px;height:1px;background:var(--accent);margin:18px auto 44px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
  @media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  figure{margin:0}
  .card{overflow:hidden;border-radius:4px;background:#fff;box-shadow:0 1px 3px rgba(43,39,36,.08)}
  .card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;transition:transform .5s ease}
  figure:hover .card img{transform:scale(1.04)}
  figcaption{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:12px}

  .alt{background:#f3eee6;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stages-cols{display:grid;grid-template-columns:1fr 1fr;gap:48px;max-width:900px;margin:0 auto}
  @media(max-width:720px){.stages-cols{grid-template-columns:1fr}}
  .stages-cols h3{font-family:var(--serif);font-size:1.5rem;font-weight:600;margin-bottom:12px}
  .stages-cols p{color:#5a534b}

  .hist{display:grid;grid-template-columns:1fr 1fr;gap:0 56px;max-width:900px;margin:56px auto 0}
  @media(max-width:720px){.hist{grid-template-columns:1fr}}
  .hist h3{font-family:var(--serif);font-size:1.5rem;font-weight:600;margin-bottom:10px}
  .hist-group h4{font-family:var(--sans);font-weight:500;font-size:.78rem;letter-spacing:.2em;color:var(--accent);margin:22px 0 2px}
  .hist-group.folded{display:none}
  figure.hist-item{display:flex;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
  figure.hist-item img{width:56px;height:56px;object-fit:cover;border-radius:3px;flex-shrink:0}
  figure.hist-item .ph{width:56px;height:56px;border-radius:3px;flex-shrink:0;background:#ece5da;display:flex;align-items:center;justify-content:center;color:#c4b8a8;font-size:1.1rem}
  figure.hist-item figcaption{text-transform:none;letter-spacing:0;font-size:.98rem;color:var(--ink);text-align:left;margin:0}
  figure.hist-item.has-g{cursor:zoom-in}
  figure.hist-item.has-g:hover figcaption{color:var(--accent)}
  .gcount{font-size:.72rem;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
  .hist-toggle{background:none;border:none;color:var(--accent);font-family:var(--sans);font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:14px 0 0;opacity:.85}
  .hist-toggle:hover{opacity:1;background:none}

  .grid figure{cursor:zoom-in}
  .lb{position:fixed;inset:0;z-index:100;background:rgba(30,26,23,.94);display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px}
  .lb.open{display:flex}
  .lb img{max-width:min(92vw,1000px);max-height:78vh;border-radius:4px;box-shadow:0 10px 50px rgba(0,0,0,.5)}
  .lb-cap{color:#e8e0d5;font-family:var(--serif);font-style:italic;font-size:1.15rem;margin-top:18px;letter-spacing:.04em}
  .lb button{position:absolute;background:none;border:none;color:#e8e0d5;cursor:pointer;padding:16px;font-family:var(--sans);opacity:.7;transition:opacity .2s;letter-spacing:0;text-transform:none}
  .lb button:hover{opacity:1;background:none}
  .lb-close{top:14px;right:18px;font-size:2rem;line-height:1}
  .lb-prev,.lb-next{top:50%;transform:translateY(-50%);font-size:2.6rem}
  .lb-prev{left:10px}
  .lb-next{right:10px}
  @media(max-width:600px){.lb-prev{left:0}.lb-next{right:0}.lb img{max-width:96vw}}

  .contact-box{max-width:560px;margin:0 auto}
  form{display:grid;gap:16px}
  label{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  input,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:3px;background:#fff;font-family:var(--sans);font-size:1rem;color:var(--ink)}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  button{justify-self:center;margin-top:8px;padding:13px 44px;background:var(--accent);color:#fff;border:none;border-radius:3px;font-family:var(--sans);font-size:.9rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .2s}
  button:hover{background:#823b2f}

  footer{border-top:1px solid var(--line);padding:34px 0;text-align:center;color:var(--muted);font-size:.85rem;letter-spacing:.06em}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="#">Karin <span>Schmitt</span></a>
    <nav>
      <a href="#porcelaine">Porcelaine</a>
      <a href="#ceramique">Céramique</a>
      <a href="#stages">Stages</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<div class="hero">
  <h1>Karin Schmitt</h1>
  <p class="sub">Céramiques &amp; porcelaines peintes</p>
  <div class="band"><img src="images/hero-bols.jpg" alt="Bols en porcelaine peints à la main"></div>
</div>

<div class="poem wrap" id="txt-poeme"></div>

<section id="porcelaine">
  <div class="wrap">
    <div class="sec-title">
      <h2>Porcelaine</h2>
      <p id="txt-porcelaine_intro"></p>
    </div>
    <div class="rule"></div>
    <div class="grid" id="grid-porcelaine"></div>
  </div>
</section>

<section id="ceramique" class="alt">
  <div class="wrap">
    <div class="sec-title">
      <h2>Céramique</h2>
      <p id="txt-ceramique_intro"></p>
    </div>
    <div class="rule"></div>
    <div class="grid" id="grid-ceramique"></div>
  </div>
</section>

<section id="stages">
  <div class="wrap">
    <div class="sec-title">
      <h2>Stages &amp; Évènements</h2>
    </div>
    <div class="rule"></div>
    <div class="stages-cols">
      <div>
        <h3 id="txt-stages_atelier_titre"></h3>
        <p id="txt-stages_atelier"></p>
      </div>
      <div>
        <h3 id="txt-stages_alsace_titre"></h3>
        <p id="txt-stages_alsace"></p>
      </div>
    </div>

    <div class="hist">
      <div id="hist-evenements"><h3>Évènements passés</h3></div>
      <div id="hist-stages"><h3>Stages passés</h3></div>
    </div>
  </div>
</section>

<section id="contact" class="alt">
  <div class="wrap">
    <div class="sec-title">
      <h2>Contact</h2>
      <p id="txt-contact_intro"></p>
    </div>
    <div class="rule"></div>
    <div class="contact-box">
      <form id="contact-form">
        <div><label for="name">Votre nom</label><input type="text" id="name" name="name" required></div>
        <div><label for="email">Votre e-mail</label><input type="email" id="email" name="email" required></div>
        <div><label for="message">Votre message</label><textarea id="message" name="message" rows="6" required></textarea></div>
        <button type="submit">Envoyer</button>
        <p style="text-align:center;font-size:.82rem;color:var(--muted)">Le bouton ouvre votre messagerie avec le message pré-rempli.</p>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">Karin Schmitt — Céramiques &amp; porcelaines peintes</div>
</footer>

<div class="lb" id="lb" role="dialog" aria-label="Visionneuse d'images">
  <button class="lb-close" aria-label="Fermer">×</button>
  <button class="lb-prev" aria-label="Précédente">‹</button>
  <img alt="">
  <p class="lb-cap"></p>
  <button class="lb-next" aria-label="Suivante">›</button>
</div>

<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}

  /* ---------- rendu depuis content.json ---------- */
  function render(C){
    // textes
    Object.keys(C.textes||{}).forEach(function(k){
      var el=document.getElementById('txt-'+k);
      if(el)el.innerHTML=C.textes[k];
    });
    // galeries
    ['porcelaine','ceramique'].forEach(function(sec){
      var host=document.getElementById('grid-'+sec);
      host.innerHTML=(C.galeries[sec]||[]).map(function(p){
        return '<figure><div class="card"><img src="'+esc(p.src)+'" alt="'+esc(p.legende)+'" loading="lazy"></div>'
          +'<figcaption>'+esc(p.legende)+'</figcaption></figure>';
      }).join('');
    });
    // historique (chaque ligne peut porter une galerie → lightbox)
    ['evenements','stages'].forEach(function(cat){
      var host=document.getElementById('hist-'+cat);
      host.querySelectorAll('.hist-group,.hist-toggle').forEach(function(n){n.remove()});
      (C.historique[cat]||[]).forEach(function(g){
        var d=document.createElement('div');d.className='hist-group';
        d.innerHTML='<h4>'+esc(g.groupe)+(g.periode?' · '+esc(g.periode):'')+'</h4>';
        (g.items||[]).forEach(function(it){
          var photos=it.photos||(it.src?[it.src]:[]);
          var f=document.createElement('figure');
          f.className='hist-item'+(photos.length?' has-g':'');
          var im=photos.length?'<img src="'+esc(photos[0])+'" alt="'+esc(it.legende||it.titre)+'" loading="lazy">':'<span class="ph">✦</span>';
          f.innerHTML=im+'<figcaption>'+esc(it.titre)+(photos.length>1?' <span class="gcount">'+photos.length+' photos</span>':'')+'</figcaption>';
          if(photos.length){
            f.addEventListener('click',function(){
              openLb(photos.map(function(p){return {src:p,cap:it.titre+(it.legende?' — '+it.legende:'')}}),0);
            });
          }
          d.appendChild(f);
        });
        host.appendChild(d);
      });
    });
    initLightbox();initToggles();
  }

  /* ---------- lightbox (galeries + historique) ---------- */
  var lb=document.getElementById('lb'),lbImg=lb.querySelector('img'),lbCap=lb.querySelector('.lb-cap'),slides=[],cur=0;
  function show(i){
    if(!slides.length)return;
    cur=(i+slides.length)%slides.length;
    lbImg.src=slides[cur].src;
    lbCap.textContent=slides[cur].cap;
    lb.classList.add('open');
  }
  function openLb(list,i){slides=list;show(i)}
  function initLightbox(){
    var figs=[].slice.call(document.querySelectorAll('.grid figure'));
    figs.forEach(function(f,i){
      f.addEventListener('click',function(){
        openLb(figs.map(function(g){return {src:g.querySelector('img').src,cap:g.querySelector('figcaption').textContent}}),i);
      });
    });
  }
  lb.querySelector('.lb-close').addEventListener('click',function(){lb.classList.remove('open')});
  lb.querySelector('.lb-prev').addEventListener('click',function(e){e.stopPropagation();show(cur-1)});
  lb.querySelector('.lb-next').addEventListener('click',function(e){e.stopPropagation();show(cur+1)});
  lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('open')});
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('open'))return;
    if(e.key==='Escape')lb.classList.remove('open');
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='ArrowRight')show(cur+1);
  });

  /* ---------- listes historiques : ~3 lignes puis « Afficher plus » ---------- */
  function initToggles(){
    [].slice.call(document.querySelectorAll('.hist > div')).forEach(function(col){
      var groups=[].slice.call(col.querySelectorAll('.hist-group')),n=0,folded=[];
      groups.forEach(function(g){
        if(n>=3){g.classList.add('folded');folded.push(g);}
        n+=g.querySelectorAll('figure.hist-item').length;
      });
      if(!folded.length)return;
      var btn=document.createElement('button');
      btn.className='hist-toggle';btn.textContent='Afficher plus';
      btn.addEventListener('click',function(){
        var open=btn.textContent==='Afficher plus';
        folded.forEach(function(g){g.classList.toggle('folded',!open)});
        btn.textContent=open?'Afficher moins':'Afficher plus';
      });
      col.appendChild(btn);
    });
  }

  /* ---------- contact : mailto assemblé à l'exécution (anti-robots) ---------- */
  var u=['ka','rin','.sch','mitt','1'].join('');
  var d=['wana','doo','.fr'].join('');
  document.getElementById('contact-form').addEventListener('submit',function(e){
    e.preventDefault();
    var n=document.getElementById('name').value,
        m=document.getElementById('email').value,
        t=document.getElementById('message').value;
    var body=t+'\n\n— '+n+' ('+m+')';
    location.href='mailto:'+u+'%40'+d+'?subject='+encodeURIComponent('Message depuis karinschmitt.com — '+n)+'&body='+encodeURIComponent(body);
  });

  /* ---------- chargement ---------- */
  fetch('content.json').then(function(r){return r.json()}).then(render)
    .catch(function(){/* contenu indisponible */});
})();
</script>
</body>
</html>
